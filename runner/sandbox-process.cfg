# nsjail configuration for one playground run where the host allows no
# namespaces, as on most managed container services. The run shares the
# container's processes, network and file system, and is kept apart by what
# the runner adds: a host user of its own, a directory only that user can
# read, process limits, and a seccomp policy that also refuses internet
# sockets unless the operator allows them.

name: "nio-playground-process"
mode: ONCE
cwd: "/"

time_limit: 30

log_level: ERROR

keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "LANG=C.UTF-8"
envar: "XDG_DATA_HOME=/opt/nio-data"

clone_newuser: false
clone_newns: false
clone_newpid: false
clone_newipc: false
clone_newuts: false
clone_newcgroup: false
clone_newnet: false

rlimit_as_type: INF
rlimit_cpu: 30
rlimit_fsize: 64
rlimit_nofile: 256
