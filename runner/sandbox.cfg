# nsjail configuration for one playground run: compile a program, then run it.
# The runner starts one of these per request, so every run has its own
# processes, network and file system. The runner adds what depends on where
# the container runs: the user each run maps to, cgroup limits when the host
# allows them and process limits when it does not, and the seccomp policy.

name: "nio-playground"
mode: ONCE
hostname: "playground"
cwd: "/tmp"

# A backstop. run.sh gives each stage its own, shorter limit.
time_limit: 30

log_level: ERROR

keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "LANG=C.UTF-8"
# The compiler's object cache, warmed when the image was built. It is read
# only here, and a build that misses it compiles the runtime sources itself.
envar: "XDG_DATA_HOME=/opt/nio-data"

# A user namespace. The runner maps its user 1000 to a host user of the run's
# own, which has no rights outside the sandbox.
clone_newuser: true

# A network namespace with only loopback: a program can serve and connect to
# itself on any port, and cannot reach anything else.
clone_newnet: true
iface_no_lo: false

rlimit_as_type: INF
rlimit_cpu: 30
rlimit_fsize: 64
rlimit_nofile: 256

mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
}
mount {
  src: "/opt/nio-data"
  dst: "/opt/nio-data"
  is_bind: true
}
mount {
  src: "usr/bin"
  dst: "/bin"
  is_symlink: true
}
mount {
  src: "usr/lib"
  dst: "/lib"
  is_symlink: true
}
mount {
  src: "usr/lib64"
  dst: "/lib64"
  is_symlink: true
  mandatory: false
}
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  options: "size=128m"
}
# No /proc here. Where the container is not privileged, Docker hides parts of
# its own /proc, and the kernel then refuses a new one inside a user
# namespace. The runner mounts one in the full isolation, where it can.
# Only these four devices. They are bound straight onto nsjail's own root: a
# tmpfs mounted at /dev here would be made inside the sandbox's user
# namespace, where the kernel refuses to open devices.
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
}
mount {
  src: "/dev/random"
  dst: "/dev/random"
  is_bind: true
}
